[project]
name = "whattowatch"
version = "0.1.0"
description = "Personal Hungarian-language movie and series recommender"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic-settings",
    "httpx",
    "typer",
    "pyyaml>=6.0.3",
    "anthropic>=1.17.0",
    "python-multipart>=0.0.32",
    "claude-agent-sdk>=0.2.170",
]

[project.scripts]
wtw = "whattowatch.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "respx",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whattowatch"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/whattowatch/db/migrations/versions/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
